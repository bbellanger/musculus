services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/app/db_data
      - ./staticfiles:/app/staticfiles
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped        # unquoted `no` is read as a boolean in YAML; use "no" or this
    ports:
      - "127.0.0.1:8001:80"        # only reachable from the host itself, not the internet
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  db_data:
